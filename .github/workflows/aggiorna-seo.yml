name: Aggiorna pagine SEO dei lotti
on:
  schedule:
    - cron: '17 * * * *'   # ogni ora
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/genera-seo.mjs', 'docs/index.html']
permissions:
  contents: write
concurrency:
  group: seo
  cancel-in-progress: false
jobs:
  genera:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/genera-seo.mjs
      - name: Salva se ci sono modifiche
        run: |
          if [ -n "$(git status --porcelain docs)" ]; then
            git config user.name "seo-bot"
            git config user.email "seo-bot@users.noreply.github.com"
            git add docs
            git commit -m "Aggiorna pagine lotti, sitemap e llms.txt"
            git push
          else
            echo "Nessuna modifica"
          fi
